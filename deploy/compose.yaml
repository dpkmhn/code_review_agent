name: code-review-agent

x-api-env: &api-env
  environment: production
  github_token: ${GITHUB_TOKEN:?Set GITHUB_TOKEN}
  openai_api_key: ${OPENAI_API_KEY:?Set OPENAI_API_KEY}
  database_url: ${DATABASE_URL:?Set DATABASE_URL}
  api_access_token: ${API_ACCESS_TOKEN:?Set API_ACCESS_TOKEN}
  public_origin: https://${PUBLIC_HOST:?Set PUBLIC_HOST}
  sandbox_enabled: ${SANDBOX_ENABLED:-false}
  sandbox_worker_url: ${SANDBOX_WORKER_URL:-}
  sandbox_worker_token: ${SANDBOX_WORKER_TOKEN:-}

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: code_reviews
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      REVIEW_DB_PASSWORD: ${REVIEW_DB_PASSWORD:?Set REVIEW_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-role.sh:/docker-entrypoint-initdb.d/init-role.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d code_reviews']
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment: *api-env
    command: [python, -m, app.scripts.init_database]
    networks: [database]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=64m,mode=1777]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment: *api-env
    networks: [database, gateway, outbound]
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=64m,mode=1777]
    stop_grace_period: 5m
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/ready", timeout=5)']
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST}
      WORKSPACE_USER: ${WORKSPACE_USER:?Set WORKSPACE_USER}
      WORKSPACE_PASSWORD_HASH: ${WORKSPACE_PASSWORD_HASH:?Set WORKSPACE_PASSWORD_HASH}
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:?Set API_ACCESS_TOKEN}
    ports: ['80:80', '443:443']
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [gateway, outbound]
    depends_on:
      api:
        condition: service_healthy

networks:
  database:
    internal: true
  gateway:
    internal: true
  outbound: {}

volumes:
  postgres_data: {}
  caddy_data: {}
  caddy_config: {}
